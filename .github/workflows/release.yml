name: Release watch RPK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.storePassword }}
      KEY_PASSWORD: ${{ secrets.keyPassword }}
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Check out signing material
        uses: actions/checkout@v4
        with:
          repository: lit-apk/data_sync_sign
          path: signing
          sparse-checkout: data-sync-release.jks
          token: ${{ github.token }}

      - name: Install build tools
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure PEM signing files
        working-directory: signing
        run: |
          keytool -importkeystore \
            -srckeystore data-sync-release.jks \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srckeypass "$KEY_PASSWORD" \
            -srcalias data-sync \
            -destkeystore data-sync-release.p12 \
            -deststoretype PKCS12 \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -noprompt
          openssl pkcs12 -in data-sync-release.p12 -passin "pass:$KEYSTORE_PASSWORD" -nocerts -nodes -out private.pem
          openssl pkcs12 -in data-sync-release.p12 -passin "pass:$KEYSTORE_PASSWORD" -clcerts -nokeys -out certificate.pem
          mkdir -p ../sign/release
          cp private.pem certificate.pem ../sign/release/

      - name: Install dependencies
        run: npm ci

      - name: Build signed RPK
        run: npm run release

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact=$(find dist -maxdepth 1 -type f -name '*.rpk' -print -quit)
          test -n "$artifact"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$artifact"
